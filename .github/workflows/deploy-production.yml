name: Deploy Production

on:
  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automationxpert-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy AutomationXpert Production
    runs-on:
      - self-hosted
      - Linux
      - X64

    timeout-minutes: 30

    steps:
      - name: Deploy production
        run: sudo -n /usr/local/bin/deploy-automationxpert-production
